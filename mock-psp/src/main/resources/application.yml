server:
  port: ${PORT:8085}

spring:
  application:
    name: mock-psp
  threads:
    virtual:
      enabled: true

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

paycore:
  security:
    internal-token: ${PAYCORE_INTERNAL_TOKEN:}
    admin-token: ${PAYCORE_ADMIN_TOKEN:}
