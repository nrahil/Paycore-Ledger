server:
  port: ${PORT:8082}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: webhook-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${DB_USER:paycore}
    password: ${DB_PASSWORD:paycore}
    hikari:
      maximum-pool-size: 16
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_webhook
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: webhook-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

paycore:
  security:
    admin-token: ${PAYCORE_ADMIN_TOKEN:}
  webhook:
    kafka-listener-enabled: ${KAFKA_LISTENER_ENABLED:true}
    allow-local-targets: ${ALLOW_LOCAL_WEBHOOKS:false}
    http-timeout-ms: ${WEBHOOK_TIMEOUT_MS:2000}
