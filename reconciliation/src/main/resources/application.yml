server:
  port: ${PORT:8084}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: reconciliation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${DB_USER:paycore}
    password: ${DB_PASSWORD:paycore}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_reconciliation
    baseline-on-migrate: true
    baseline-version: 0

paycore:
  security:
    admin-token: ${PAYCORE_ADMIN_TOKEN:}
